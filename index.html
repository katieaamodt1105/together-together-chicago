<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3efe8"><title>Together, Together — Chicago 2027</title></head>
<body><p style="font-family:Arial;padding:30px">Loading the trip planner…</p>
<script>
(async()=>{try{
 const parts=await Promise.all([0,1,2,3].map(i=>fetch('./payload/part-'+i+'.txt').then(r=>{if(!r.ok)throw Error('Missing planner file '+i);return r.text()})));
 const bytes=Uint8Array.from(atob(parts.join('')),c=>c.charCodeAt(0));
 let html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
 html=html.replace("if(el.dataset.leg)f[el.dataset.leg][el.dataset.field]=v;else f[el.dataset.field]=v;","if(el.dataset.leg){f[el.dataset.leg]??={};f[el.dataset.leg][el.dataset.field]=v;}else{f[el.dataset.field]=v;}");
 const groupEasterEggs = `
<style>
#group-chat-easter-eggs{max-width:1040px;margin:36px auto 28px;padding:24px 28px;background:#172b55;color:#f5f0e6;border-radius:18px;box-shadow:0 10px 28px rgba(20,36,70,.12);font-family:inherit}
#group-chat-easter-eggs .eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;opacity:.72;margin:0 0 8px;font-weight:700}
#group-chat-easter-eggs h2{font-family:Georgia,serif;font-size:clamp(24px,3vw,34px);font-weight:400;line-height:1.1;margin:0 0 8px}
#group-chat-easter-eggs .intro{font-size:14px;line-height:1.55;opacity:.86;margin:0 0 18px;max-width:650px}
#group-chat-easter-eggs .quote-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
#group-chat-easter-eggs .quote{border:1px solid rgba(245,240,230,.24);border-radius:12px;padding:13px 15px;background:rgba(255,255,255,.045)}
#group-chat-easter-eggs .quote p{font-family:Georgia,serif;font-size:17px;line-height:1.3;margin:0 0 6px}
#group-chat-easter-eggs .quote span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
#group-chat-easter-eggs .tagline{margin:18px 0 0;padding-top:14px;border-top:1px solid rgba(245,240,230,.2);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
@media(max-width:640px){#group-chat-easter-eggs{margin:26px 14px;padding:20px 18px}#group-chat-easter-eggs .quote-grid{grid-template-columns:1fr}}
</style>
<section id="group-chat-easter-eggs" aria-label="Group chat Easter eggs">
  <p class="eyebrow">A little lore for the group chat</p>
  <h2>Let's go hangover chasin’.</h2>
  <p class="intro">The trip motto, with a few lines that have absolutely earned their place in the archive.</p>
  <div class="quote-grid">
    <div class="quote"><p>“If ghosts aren’t real… explain this!”</p><span>Katie lore</span></div>
    <div class="quote"><p>“Prick your finger, use your blood!”</p><span>Mel lore</span></div>
    <div class="quote"><p>“Whoa, I thought you were a ghost.”</p><span>Vanessa lore</span></div>
    <div class="quote"><p>“I’m a witch!”</p><span>Becca lore</span></div>
  </div>
  <p class="tagline">Midnight Margaritas · Minky-Sota · Together, Together</p>
</section>`;
 const bodyClose = html.lastIndexOf('</body>');
 if(bodyClose !== -1) html = html.slice(0,bodyClose) + groupEasterEggs + html.slice(bodyClose);
 document.open();document.write(html);document.close();
}catch(e){document.body.textContent='The trip planner could not load: '+e;console.error(e)}})();
</script></body></html>
