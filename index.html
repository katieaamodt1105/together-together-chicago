<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3efe8"><title>Together, Together — Chicago 2027</title></head>
<body><p style="font-family:Arial;padding:30px">Loading the trip planner…</p>
<script>
(async()=>{try{
 const parts=await Promise.all([0,1,2,3].map(i=>fetch('./payload/part-'+i+'.txt').then(r=>{if(!r.ok)throw Error('Missing planner file '+i);return r.text()})));
 const bytes=Uint8Array.from(atob(parts.join('')),c=>c.charCodeAt(0));
 let html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
 html=html.replace("if(el.dataset.leg)f[el.dataset.leg][el.dataset.field]=v;else f[el.dataset.field]=v;","if(el.dataset.leg){f[el.dataset.leg]??={};f[el.dataset.leg][el.dataset.field]=v;}else{f[el.dataset.field]=v;}");
 const harryReferences = `
<style>
#harry-trip-notes{max-width:1040px;margin:34px auto 26px;padding:22px 26px;background:#172b55;color:#f5f0e6;border-radius:16px;font-family:inherit}
#harry-trip-notes .kicker{font-size:10px;letter-spacing:.2em;text-transform:uppercase;opacity:.72;margin:0 0 8px;font-weight:700}
#harry-trip-notes h2{font-family:Georgia,serif;font-size:clamp(23px,3vw,32px);font-weight:400;line-height:1.15;margin:0 0 8px}
#harry-trip-notes .lead{font-size:13px;line-height:1.5;opacity:.85;margin:0 0 16px}
#harry-trip-notes .refs{display:flex;flex-wrap:wrap;gap:8px}
#harry-trip-notes .ref{border:1px solid rgba(245,240,230,.3);border-radius:999px;padding:8px 12px;font-size:10px;letter-spacing:.1em;text-transform:uppercase}
@media(max-width:640px){#harry-trip-notes{margin:24px 14px;padding:19px 17px}}
</style>
<section id="harry-trip-notes" aria-label="Harry Styles references">
  <p class="kicker">A little Harry-coded</p>
  <h2>Let’s go hangover chasin’.</h2>
  <p class="lead">A few quiet nods for the weekend soundtrack. No deep-cut homework required.</p>
  <div class="refs">
    <span class="ref">Satellite · flight check-ins</span>
    <span class="ref">Golden · Chicago days</span>
    <span class="ref">Music for a Sushi Restaurant · dinner plans</span>
    <span class="ref">Late Night Talking · after hours</span>
    <span class="ref">Keep Driving · Cubs extension</span>
  </div>
</section>`;
 const bodyClose = html.lastIndexOf('</body>');
 if(bodyClose !== -1) html = html.slice(0,bodyClose) + harryReferences + html.slice(bodyClose);
 document.open();document.write(html);document.close();
}catch(e){document.body.textContent='The trip planner could not load: '+e;console.error(e)}})();
</script></body></html>
